appId: com.agraabhi.oshodiscourses
name: 02 Library search and filter chip open a series
---
- launchApp
- runFlow:
    file: ../subflows/tab_root.yaml
    env:
      TAB: library
- runFlow:
    when:
      visible: "Clear text"
    commands:
      - tapOn: "Clear text"
- tapOn: "Hindi"
- assertVisible: "Adhyatam Upanishad"
- assertNotVisible: "A Bird on the Wing"
- tapOn: "English"
- assertVisible: "A Bird on the Wing"
- assertNotVisible: "Adhyatam Upanishad"
- tapOn: "Search by name or topic"
- inputText: "Bird on the"
- hideKeyboard
- assertVisible: "A Bird on the Wing"
- assertNotVisible: "A Sudden Clash of Thunder"
- takeScreenshot: 02_library_filtered
- tapOn: "A Bird on the Wing"
- assertVisible: "11 discourses"
- assertVisible: "Download All"
- assertVisible: "Discourse 1(,.*)?"
- tapOn: "Back"
- tapOn: "Clear text"
- tapOn: "All"
