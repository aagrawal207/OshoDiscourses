name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "OshoDiscourses/Resources/*.json"
      - ".github/workflows/android.yml"
  push:
    branches: [android]
    paths:
      - "android/**"
      - "OshoDiscourses/Resources/*.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Current AndroidX and Compose compile against API 37; the runner image may only ship 36.
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      # Screenshots are recorded on macOS; pixel comparison across OSes is left to local runs.
      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/tests/
          if-no-files-found: ignore
